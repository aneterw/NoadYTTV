name: Build & Sign Release

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      KEYSTORE_ALIAS: noadytv

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          chmod 600 release.keystore

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Install apksigner (use pre-installed Android SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # Try common pre-installed locations
          for path in \
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" \
            "/usr/lib/android-sdk/build-tools/34.0.0/apksigner" \
            ; do
            if [ -f "$path" ]; then
              echo "Found apksigner at $path"
              sudo ln -sf "$path" /usr/local/bin/apksigner
              break
            fi
          done
          command -v apksigner || { echo "apksigner not found in any location"; exit 1; }

      - name: Sign APK (jarsigner + apksigner v2/v3)
        env:
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          UNSIGNED="app-release-unsigned.apk"
          PATH_TO_UNSIGNED="app/build/outputs/apk/release/$UNSIGNED"
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+')
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | grep -oE '"[^"]+"' | tr -d '"')
          SIGNED="NoadYTTV-v${VERSION_NAME}.apk"
          OUTPUT_DIR="app/build/outputs/apk/release/"

          # jarsigner → v1 ZIP signature
          JARRED="${UNSIGNED%.apk}-signed-jar.apk"
          jarsigner \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -signedjar "$JARRED" \
            "$PATH_TO_UNSIGNED" \
            "$KEYSTORE_ALIAS"

          # apksigner → v2/v3 block signatures
          FINAL="$OUTPUT_DIR$SIGNED"
          if command -v apksigner &>/dev/null; then
            apksigner sign \
              --ks "$KEYSTORE_PATH" \
              --ks-pass pass:"$KS_PASS" \
              --key-pass pass:"$KEY_PASS" \
              --ks-key-alias "$KEYSTORE_ALIAS" \
              --out "$FINAL" \
              "$JARRED"
          else
            cp "$JARRED" "$FINAL"
            echo "WARNING: apksigner not found — v1-only signing"
          fi

          echo "=== Signed APK ==="
          ls -lh "$FINAL"
          echo "Version: v${VERSION_NAME} (code ${VERSION_CODE})"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoadYTTV-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
